# 云编译工作流：在 GitHub 免费的 macOS 服务器上编译出未签名 .ipa
# （Windows 无 Xcode，无法本地编译 iOS 应用；此方案无需 Mac）
#
# 使用方法：
#   1. 把本文件夹（NASPhotoAlbum）的全部内容上传到 GitHub 仓库
#   2. 仓库页面 → Actions 标签 → 首次进入点 "I understand my workflows, go ahead and enable them"
#   3. 左侧选 "Build iOS IPA" → Run workflow → Run
#   4. 等待约 10 分钟，点击本次运行记录，页面底部 Artifacts 处下载 ipa
#   5. 在 Windows 上用 Sideloadly / 爱思助手签名并安装到 iPad
#
# 注：macos-15 自带 Xcode 16.x（支持 iOS 12 部署目标）。
#     若未来 runner 升级导致报部署目标错误，将 runs-on 改为 macos-14 即可。

name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          xcodebuild -version
          pod --version

      # 兼容两种上传方式：仓库根=项目根，或仓库根含 iOS/NASPhotoAlbum 子目录
      - name: Locate project
        run: |
          if [ -f Podfile ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          elif [ -f iOS/NASPhotoAlbum/Podfile ]; then
            echo "PROJECT_DIR=iOS/NASPhotoAlbum" >> $GITHUB_ENV
          else
            echo "::error::未找到 Podfile，请确认仓库根目录结构"
            exit 1
          fi
          echo "项目目录: $PROJECT_DIR"

      - name: CocoaPods install (AMSMB2 2.7.1)
        working-directory: ${{ env.PROJECT_DIR }}
        run: pod install

      - name: Build archive (unsigned)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace NASPhotoAlbum.xcworkspace \
            -scheme NASPhotoAlbum \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/NASPhotoAlbum.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" 2>&1 | tee build.log

      # 编译失败时自动提取 error 行，不用在日志里翻找
      - name: Show errors on failure
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "===== 编译错误汇总 ====="
          grep -B2 "error:" build.log || echo "（未找到 error 行，失败原因在上方日志中）"

      - name: Package unsigned IPA
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p build/Payload
          cp -R "build/NASPhotoAlbum.xcarchive/Products/Applications/NASPhotoAlbum.app" build/Payload/
          cd build
          zip -qry NASPhotoAlbum-unsigned.ipa Payload
          ls -lh NASPhotoAlbum-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NASPhotoAlbum-unsigned-ipa
          path: "**/build/NASPhotoAlbum-unsigned.ipa"
          retention-days: 90
          if-no-files-found: error
